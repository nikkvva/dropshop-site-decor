services:
  app:
    build: ./docker/php
    # Все команды (artisan, composer) выполняются от того же пользователя, что и сайт
    user: www-data
    volumes:
      - ./:/var/www/html
      # Библиотеки (vendor/) — в томе Docker, а не на диске Windows:
      # через «мост» Windows→Linux каждая страница грузилась ~10 секунд.
      # Папка vendor/ на самом диске больше не используется и не обновляется.
      - vendor:/var/www/html/vendor
    depends_on:
      - db
    # Запускаться вместе с Docker (после перезагрузки ПК), если не остановлен вручную
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      # Порты снаружи — из .env: у каждого сайта на одном ПК свои
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: site
      MYSQL_USER: site
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
      TZ: Europe/Kyiv
    ports:
      - "${DB_PORT_EXTERNAL:-3308}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped

  scheduler:
    build: ./docker/php
    user: www-data
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      - db
    # Ждём, пока выполнят composer install (появится vendor/autoload.php), потом запускаем планировщик
    command: sh -c "until [ -f artisan ] && [ -f vendor/autoload.php ]; do sleep 5; done; php artisan schedule:work"
    restart: unless-stopped

volumes:
  dbdata:
  vendor:
